<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survey</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles-shared.css">
<style>
  .rs-shell{max-width:560px;margin:34px auto 60px;padding:0 16px}
  .rs-brand{display:flex;align-items:center;gap:10px;margin-bottom:16px;justify-content:center}
  .rs-brand .mark{width:34px;height:34px;border-radius:8px;background:var(--tile);box-shadow:var(--inset);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;font-family:var(--font-heading)}
  .rs-brand span{font-family:var(--font-heading);font-weight:600;color:var(--tx)}
  #rs-log{min-height:340px;max-height:60vh}
  .rs-note{text-align:center;font-size:12px;color:var(--tx-dis);margin-top:14px;line-height:2}
  .rs-missing{text-align:center;padding:60px 20px;color:var(--tx-2)}
</style>
</head>
<body>
<div class="rs-shell">
  <div class="rs-brand"><span class="mark">SR</span><span id="brandName">Survey Rocket</span></div>
  <div class="chat-frame" id="frame">
    <div class="chat-head"><span class="av">SR</span><div><b id="rs-title">Survey</b><small id="rs-sub"></small></div><span class="chat-prog" id="rs-prog"></span></div>
    <div class="chat-log" id="rs-log" aria-live="polite"></div>
    <div class="chat-input">
      <input id="rs-inp" type="text" autocomplete="off" placeholder="Tap an option above" aria-label="Your answer" disabled>
      <button class="send" id="rs-send" disabled>Send</button>
    </div>
  </div>
  <div class="rs-missing" id="missing" style="display:none">
    This survey link is not valid, or the survey lives in another browser.<br>
    Ask for a fresh share link.
  </div>
  <div class="rs-note" id="note">
    Answers save on this device for the test phase. HubSpot write-back pending.
    <button class="btn ghost small" id="rs-restart" style="margin-left:8px">Restart</button>
    <button class="btn ghost small" id="rs-copy" style="margin-left:4px;display:none">Copy my answers</button>
  </div>
</div>

<script>/* The live judge. A small server-side agent reads each free-text answer,
   pulls the number out of a sentence, and reads sentiment with negation. If it is
   slow or down the chat falls back to the local rules and nobody sees an error. */
window.SR_JUDGE_ENABLED = true;</script>
<script src="js/engine.js"></script>
<script src="js/store.js"></script>
<script src="js/hubspot.js"></script>
<script>
(function(){
  "use strict";
  var params=new URLSearchParams(location.search);
  var survey=null, fromStore=false;

  var hash=location.hash||"";
  if(hash.indexOf("#p=")===0){
    survey=SRStore.decodeShare(hash.slice(3));
  } else if(params.get("id")){
    SRStore.init();
    survey=SRStore.getSurvey(params.get("id"));
    fromStore=true;
  }

  if(!survey || !survey.questions || !survey.questions.length){
    document.getElementById("frame").style.display="none";
    document.getElementById("note").style.display="none";
    document.getElementById("missing").style.display="block";
    return;
  }

  document.getElementById("rs-title").textContent=survey.name||"Survey";
  document.getElementById("rs-sub").textContent=survey.cadence||"";
  document.title=survey.name||"Survey";

  var lastAnswers=null;
  var chat=new SurveyChat({
    log:document.getElementById("rs-log"),
    input:document.getElementById("rs-inp"),
    sendBtn:document.getElementById("rs-send"),
    progEl:document.getElementById("rs-prog"),
    script:survey.questions,
    quoteAsk:!!survey.quoteAsk,
    outro:"That is everything. Thank you. Your answers are saved on this device.",
    onComplete:function(answers){
      lastAnswers=answers;
      try { SRStore.addResponse(survey.id||"shared", answers); } catch(e) {}
      SRHubSpot.writeBack(survey.id||"shared", answers);
      document.getElementById("rs-copy").style.display="inline-flex";
    }
  });
  document.getElementById("rs-restart").addEventListener("click",function(){ chat.start(); });
  document.getElementById("rs-copy").addEventListener("click",function(){
    if(!lastAnswers) return;
    var text=JSON.stringify({survey:survey.name, answers:lastAnswers}, null, 2);
    navigator.clipboard.writeText(text).then(function(){
      document.getElementById("rs-copy").textContent="Copied";
      setTimeout(function(){ document.getElementById("rs-copy").textContent="Copy my answers"; },2000);
    },function(){ window.prompt("Copy your answers:", text); });
  });
  chat.start();
})();
</script>
</body>
</html>
